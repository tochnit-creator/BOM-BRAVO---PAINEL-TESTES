<style>
/* =========================================================
   Bom Bravo — sistema visual compartilhado
   Usado por cliente.html e admin.html
   ========================================================= */

:root {
  /* cores base — extraídas da marca (touro preto/vermelho/branco) */
  --forest-950: #060606;
  --forest-900: #101010;
  --forest-800: #1b1b1b;
  --forest-700: #272727;

  --cream: #f7f4ec;
  --paper: #ffffff;
  --ink: #1c1712;
  --ink-soft: #55493c;
  --smoke: #8a7f6f;
  --line: #e8e0d0;
  --line-strong: #d6c9ae;

  --ember: #bd3329;
  --ember-dark: #8c2620;
  --ember-tint: #f6e1dd;

  --gold: #b6893c;
  --gold-dark: #8f6a2d;
  --gold-tint: #f4e8d1;

  --sage: #2f6b46;
  --sage-dark: #234f34;
  --sage-tint: #dcebe0;

  --slate: #6b6259;
  --slate-tint: #ece6db;

  --done: #9a8f7c;
  --done-tint: #efe9dc;

  --shadow-1: 0 1px 2px rgba(20, 14, 6, 0.07), 0 3px 12px rgba(20, 14, 6, 0.06);
  --shadow-2: 0 12px 34px rgba(12, 8, 4, 0.14), 0 2px 8px rgba(12, 8, 4, 0.08);
  --shadow-3: 0 26px 64px rgba(4, 3, 2, 0.4);

  --font-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", serif;
  --font-body: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  --radius-card: 18px;
  --radius-control: 10px;
  --radius-pill: 999px;
  --sidebar-w: 240px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--cream);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; color: var(--ink); margin: 0 0 0.4em; }
p { margin: 0 0 1em; color: var(--ink-soft); }
a { color: inherit; }
button { font-family: inherit; }
:focus-visible { outline: 2.5px solid var(--gold); outline-offset: 2px; }

.container { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

/* ---------- brand badge (medalhão do logo) ---------- */
.brand-badge {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 7px;
  background: radial-gradient(circle at 35% 28%, #202020, #000);
  border: 1px solid rgba(182, 137, 60, 0.55);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05), 0 0 0 3px rgba(182, 137, 60, 0.08), 0 3px 10px rgba(0, 0, 0, 0.5);
}
.brand-badge img { width: 100%; height: 100%; object-fit: contain; display: block; }
.brand-name {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.2px;
  color: var(--cream);
}
.brand-tag {
  font-size: 11.5px;
  letter-spacing: 0.2px;
  color: rgba(250, 246, 238, 0.55);
  margin-top: -1px;
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: var(--radius-control);
  border: 1px solid transparent;
  padding: 11px 18px;
  font-size: 14.5px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease, opacity 0.15s ease;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.btn-primary {
  background: var(--ember);
  color: #fff8f2;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 6px 16px rgba(140, 38, 32, 0.32);
}
.btn-primary:hover:not(:disabled) { background: var(--ember-dark); }

.btn-forest { background: var(--forest-900); color: var(--cream); }
.btn-forest:hover:not(:disabled) { background: var(--forest-800); }

.btn-ghost { background: transparent; color: var(--ink-soft); border-color: var(--line-strong); }
.btn-ghost:hover:not(:disabled) { background: var(--paper); border-color: var(--smoke); }

.btn-gold { background: var(--gold); color: #2b1f0c; }
.btn-gold:hover:not(:disabled) { background: var(--gold-dark); color: #fff; }

.btn-sage { background: var(--sage); color: #fff; }
.btn-sage:hover:not(:disabled) { background: var(--sage-dark); }

.btn-small { padding: 7px 13px; font-size: 13px; border-radius: 8px; }
.btn-block { width: 100%; }
.btn-icon { padding: 9px; }

/* ---------- forms ---------- */
label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
.field { margin-bottom: 16px; }
.input, select.input, textarea.input {
  width: 100%;
  border: 1.5px solid var(--line-strong);
  background: var(--paper);
  border-radius: var(--radius-control);
  padding: 11px 14px;
  font-size: 15px;
  font-family: inherit;
  color: var(--ink);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input:focus, select.input:focus, textarea.input:focus {
  border-color: var(--ember);
  box-shadow: 0 0 0 4px var(--ember-tint);
  outline: none;
}
textarea.input { resize: vertical; min-height: 72px; }
.input-row { display: flex; gap: 10px; }
.help-text { font-size: 12.5px; color: var(--smoke); margin-top: 6px; }

.error-msg {
  background: var(--ember-tint);
  color: var(--ember-dark);
  border: 1px solid rgba(193, 68, 44, 0.25);
  padding: 12px 14px;
  border-radius: var(--radius-control);
  font-size: 14px;
  font-weight: 600;
}
.success-msg {
  background: var(--sage-tint);
  color: var(--sage-dark);
  border: 1px solid rgba(63, 122, 82, 0.25);
  padding: 10px 14px;
  border-radius: var(--radius-control);
  font-size: 13.5px;
  font-weight: 600;
}

/* ---------- cards ---------- */
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-1);
}

.gold-edge { position: relative; }
.gold-edge::before {
  content: "";
  position: absolute;
  top: 0; left: 18px; right: 18px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  border-radius: 0 0 4px 4px;
}

/* ---------- status pill / badge ---------- */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 13px 5px 9px;
  border-radius: var(--radius-pill);
  font-size: 12.5px;
  font-weight: 700;
}
.status-pill .dot { width: 7px; height: 7px; border-radius: 50%; }

.status-aguardando_confirmacao { background: var(--slate-tint); color: var(--slate); }
.status-aguardando_confirmacao .dot { background: var(--slate); }
.status-em_preparacao { background: var(--gold-tint); color: var(--gold-dark); }

/* ---------- loading / skeleton ---------- */

@keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

/* ---------- modal ---------- */
.modal-backdrop {

.stepper { display: flex; margin-bottom: 8px; }
.step { flex: 1; text-align: center; position: relative; }

}

<main class="cliente-main">
  <div class="ticket-wrap">

    <section class="ticket-card" id="lookup-card">
      <div class="ticket-eyebrow">Consulta de pedido</div>
      <form id="lookup-form" autocomplete="off">
        <input class="input" id="codigo-input" placeholder="BB-0000" maxlength="20" required />
        <button class="btn btn-primary" type="submit" id="lookup-btn">
          <span id="lookup-btn-text">Consultar</span>
        </button>
      </form>
      <div class="error-msg hidden" id="lookup-error"></div>
    </section>

    <section class="ticket-card hidden" id="status-card">
      <div class="status-card-head">
        <span class="order-code" id="order-code">—</span>
        <span class="last-updated" id="last-updated"></span>
      </div>

      <div class="stepper" id="stepper"></div>

      <div class="ticket-divider"></div>

      <div class="order-details">
        <h2>Itens do pedido</h2>
        <ul id="order-items"></ul>
        <div class="order-total-row">
          <span>Total</span>
          <strong id="order-total">R$ 0,00</strong>
        </div>
        <div class="order-payment">Pagamento: <span id="order-payment">—</span></div>
      </div>

      <button class="btn btn-ghost btn-block" id="track-another">Consultar outro pedido</button>
    </section>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function () {
  // ---------------------------------------------------------------
  // CONFIGURAÇÃO DO SUPABASE — edite as duas linhas abaixo.
  // Veja o LEIA-ME.md para o passo a passo (criar projeto, rodar o
  // schema.sql e pegar essas duas chaves em Project Settings > API).
  // A "anon public key" é segura para ficar aqui: quem protege os
  // dados são as regras de RLS do schema.sql, não o segredo da chave.
  // ---------------------------------------------------------------
  const CFG = {
    supabaseUrl: "https://qlvcqhjnhvwzweuzlbaw.supabase.co",
    supabaseAnonKey: "sb_publishable_Cj5lan3r7E9nMNjUr0aVTg_SVrfh0p-",
  };
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);

  const ICON_SVG = {
    clock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
    flame: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-2.5 4-2.5 7.5A4.5 4.5 0 0 0 14 14c1.8 0 2.5-1.2 2.5-1.2S18 15 18 17a6 6 0 1 1-12 0c0-4 2-5 2-8 0-2 1-4 1-4s1 2 3-3z"/></svg>',
    bag: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
    check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  };

  const STEPS = [
    { key: "aguardando_confirmacao", label: "Aguardando confirmação", icon: ICON_SVG.clock },
    { key: "em_preparacao", label: "Em preparação", icon: ICON_SVG.flame },
    { key: "pronto_retirada", label: "Pronto pra retirada", icon: ICON_SVG.bag },
    { key: "retirado", label: "Retirado", icon: ICON_SVG.check },
  ];

  const lookupForm = document.getElementById("lookup-form");
  const codigoInput = document.getElementById("codigo-input");
  const lookupBtn = document.getElementById("lookup-btn");
  const lookupBtnText = document.getElementById("lookup-btn-text");
  const lookupError = document.getElementById("lookup-error");
  const lookupCard = document.getElementById("lookup-card");
  const statusCard = document.getElementById("status-card");
  const stepperEl = document.getElementById("stepper");
  const orderCodeEl = document.getElementById("order-code");
  const lastUpdatedEl = document.getElementById("last-updated");
  const orderItemsEl = document.getElementById("order-items");
  const orderTotalEl = document.getElementById("order-total");
  const orderPaymentEl = document.getElementById("order-payment");
  const trackAnotherBtn = document.getElementById("track-another");

  let pollTimer = null;
  let lastStatus = null;
  let currentCode = null;

  function money(v) {
    return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }

  function formatItem(item) {
    const qtd = item.quantidade ?? 1;
    const unidade = item.unidade || "un";
    let text = `${qtd} ${unidade} de ${item.nome}`;
    if (item.detalhe) text += ` — ${item.detalhe}`;
    return text;
  }

  function renderStepper(statusKey) {
    const idx = STEPS.findIndex((s) => s.key === statusKey);
    const isFinal = idx === STEPS.length - 1; // "retirado" — jornada completa, nada mais "em andamento"
    stepperEl.innerHTML = STEPS.map((s, i) => {
      let cls = "step";
      if (i < idx || (isFinal && i === idx)) cls += " done";
      else if (i === idx) cls += " current";
      return `
        <div class="${cls}">
          <div class="track"><div class="track-fill"></div></div>
          <div class="step-dot">${i < idx || (isFinal && i === idx) ? ICON_SVG.check : s.icon}</div>
          <div class="step-label">${s.label}</div>
        </div>`;
    }).join("");
  }

  function renderOrder(pedido, { celebrate } = {}) {
    orderCodeEl.textContent = pedido.codigo;
    renderStepper(pedido.status);
    orderItemsEl.innerHTML = (pedido.itens || []).map((it) => `<li>${formatItem(it)}</li>`).join("") || "<li class='muted'>Sem itens detalhados</li>";
    orderTotalEl.textContent = money(pedido.total);
    orderPaymentEl.textContent = pedido.pagamento || "—";
    lastUpdatedEl.textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

    lookupCard.classList.add("hidden");
    statusCard.classList.remove("hidden");

    if (celebrate) {
      statusCard.classList.add("celebrate");
      setTimeout(() => statusCard.classList.remove("celebrate"), 2200);
    }
  }

  async function buscarPedido(codigo) {
    const { data, error } = await sb.rpc("consultar_pedido", { p_codigo: codigo });
    if (error) throw error;
    if (!data || data.length === 0) return null;
    return data[0];
  }

  function pararPolling() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function iniciarPolling(codigo) {
    pararPolling();
    pollTimer = setInterval(async () => {
      try {
        const pedido = await buscarPedido(codigo);
        if (!pedido) return;
        const celebrate = lastStatus && lastStatus !== "pronto_retirada" && pedido.status === "pronto_retirada";
        lastStatus = pedido.status;
        renderOrder(pedido, { celebrate });
        if (pedido.status === "retirado") pararPolling();
      } catch (e) {
        /* silencioso — tenta de novo no próximo ciclo */
      }
    }, 12000);
  }

  lookupForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const codigo = codigoInput.value.trim().toUpperCase();
    if (!codigo) return;

    lookupError.classList.add("hidden");
    lookupBtn.disabled = true;
    lookupBtnText.innerHTML = '<span class="spinner"></span>';

    try {
      const pedido = await buscarPedido(codigo);
      if (!pedido) {
        lookupError.textContent = "Não encontramos nenhum pedido com esse código. Confira e tente novamente.";
        lookupError.classList.remove("hidden");
      } else {
        currentCode = codigo;
        lastStatus = pedido.status;
        renderOrder(pedido);
        if (pedido.status !== "retirado") iniciarPolling(codigo);
      }
    } catch (err) {
      lookupError.textContent = "Não foi possível consultar agora. Verifique sua conexão e tente de novo.";
      lookupError.classList.remove("hidden");
    } finally {
      lookupBtn.disabled = false;
      lookupBtnText.textContent = "Consultar";
    }
  });

  trackAnotherBtn.addEventListener("click", () => {
    pararPolling();
    currentCode = null;
    lastStatus = null;
    codigoInput.value = "";
    statusCard.classList.add("hidden");
    lookupCard.classList.remove("hidden");
    codigoInput.focus();
  });

  codigoInput.addEventListener("input", () => {
    codigoInput.value = codigoInput.value.toUpperCase();
  });
})();
</script>
</body>
</html>
